name: offline SDK conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[governed]' pytest build
      - run: python -m pytest -q tests
      - run: python -m build
      - run: python -m pip check
      - name: Exercise wheel and sdist public API in clean environments
        shell: bash
        run: |
          for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            artifact_env="$RUNNER_TEMP/$(basename "$artifact").env"
            python -m venv "$artifact_env"
            "$artifact_env/bin/python" -m pip install "$artifact" 'tria-sdk @ git+https://github.com/TrivianTechnologies/tria-sdk.git@03b8ef764a60c5ba01031ddaf363028e5c49f7d9' pytest
            (cd "$RUNNER_TEMP" && "$artifact_env/bin/python" -m pytest -q -c /dev/null "$GITHUB_WORKSPACE/tests")
            "$artifact_env/bin/python" -m pip check
          done
